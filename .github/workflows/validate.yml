name: Validate pull requests
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/worker.test.mjs
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -p 'test_*.py' -v
      - run: python preview.py --build-only
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tests/browser_smoke.py
      - run: python tests/mobile_navigation.py
