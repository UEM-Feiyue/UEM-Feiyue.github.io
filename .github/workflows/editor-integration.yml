name: Validate submission editor
on:
  push:
    branches: [feature/tiptap-submission]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build:editor
      - uses: actions/upload-artifact@v4
        with:
          name: submission-editor-bundle
          path: assets/js/editor/editor.js
