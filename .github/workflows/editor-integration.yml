name: Validate submission editor
on:
  push:
    branches: [feature/tiptap-submission]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Commit generated dependency lockfile
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock submission editor dependencies'
            git push origin HEAD:feature/tiptap-submission
          fi
      - run: npm run build:editor
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submission-editor-results
          path: |
            assets/js/editor/editor.js
            package-lock.json
            playwright-report
            test-results
