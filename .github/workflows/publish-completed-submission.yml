name: Publish completed UEM submissions

on:
  issues:
    types: [closed]

concurrency:
  group: uem-submission-publication
  cancel-in-progress: false

permissions:
  contents: write
  issues: read

jobs:
  publish:
    if: ${{ !github.event.issue.pull_request && github.event.issue.state_reason == 'completed' && github.event.sender.login == 'FuTseYi' && startsWith(github.event.issue.title, '[飞跃手册投稿] ') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Import and publish reviewed Issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B publication origin/main
            python scripts/import_completed_submission.py
            git add -A -- content/community/
            if git diff --cached --quiet; then
              echo 'Already published; no changes'
              exit 0
            fi
            # An untrusted Issue must never change anything outside the approved content path.
            git diff --cached --name-only | grep -Ex 'content/community/issue-[0-9]+\.md' >/dev/null
            python -m unittest discover -s tests -t . -p 'test_*.py'
            python preview.py --build-only
            git commit -m "docs: publish reviewed UEM submission #${ISSUE_NUMBER}"
            if git push origin HEAD:main; then exit 0; fi
            echo "main changed; retrying (${attempt}/3)"
          done
          exit 1
