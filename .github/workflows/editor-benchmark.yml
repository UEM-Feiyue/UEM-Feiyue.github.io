name: Editor benchmark (isolated)
on:
  workflow_dispatch:
  push:
    branches: [experiment/editor-benchmark]
    paths: ['benchmark/editor/**', '.github/workflows/editor-benchmark.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmark/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run benchmark
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-benchmark-results
          path: |
            benchmark/editor/dist-tiptap
            benchmark/editor/dist-milkdown
            benchmark/editor/playwright-report
            benchmark/editor/test-results
